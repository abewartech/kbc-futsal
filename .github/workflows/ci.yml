name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  node:
    name: Node 18
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Run tests
        run: npm test -- --ci --watchAll=false

      - name: Run linter
        run: npm run lint --if-present
